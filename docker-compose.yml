version: "2.4"
networks:
  network1:
    driver: bridge
    ipam:
      config:
      - subnet: "10.18.1.0/24"
  network2:
    driver: bridge
    ipam:
      config:
      - subnet: "10.18.2.0/24"
  network3:
    driver: bridge
    ipam:
      config:
      - subnet: "10.18.3.0/24"
services:
  desktop:
    # image: hilschernetpi/netpi-desktop-hdmi
    # image: registry.cn-shenzhen.aliyuncs.com/infrasync/v2025:hilschernetpi--netpi-desktop-hdmi---1.3.0
    # image: registry.cn-shenzhen.aliyuncs.com/infrastlabs/docker-hdmi-desktop:latest
    #x11-base:core-debian-8 => Xorg :1 #err: no screen found
    # image: registry.cn-shenzhen.aliyuncs.com/infrastlabs/x11-base:app-ubuntu-20.04
    image: registry.cn-shenzhen.aliyuncs.com/infrastlabs/docker-hdmi-desktop:${ENV_TAG:-app-ubuntu-20.04} #9>12 #24.04>22.04>20.04
    entrypoint: bash /entry-x11base.sh
    # entrypoint: bash /entrypoint2.sh
    # entrypoint: bash -c
    # command: "\"echo wait...; tail -f /dev/null;\"" 
    hostname: hdmi-desktop
    restart: none #unless-stopped always
    privileged: true
    # network_mode: bridge #host
    networks:
      - network1
      - network2
      - network3
      # network1:
      #   interface_name: eth01 #eth0; docker-ce:v28.1+
      # network2:
      #   interface_name: eth02
      # network3:
      #   interface_name: eth03
    ports:
      - 51022:51022
      - 51081:51081
      - 52022:52022
      - 52081:52081
      - 4096:4096
    devices:
      - "/dev:/dev"
      # - "/dev/tty0:/dev/tty0"
      # - "/dev/tty2:/dev/tty2"
      # - "/dev/fb0:/dev/fb0"
      # - "/dev/input:/dev/input"
      # - "/dev/snd:/dev/snd"
    volumes: 
      - ./src/bin/:/usr/local/bin/
      - ./src/entrypoint.sh:/entrypoint.sh
      - ./src/entrypoint2.sh:/entrypoint2.sh
      - ./src/entry-x11base.sh:/entry-x11base.sh
      - ./src/xvnc2.sh:/xvnc2.sh
      - /_ext:/_ext
      # - /opt:/opt
    environment:
      # - "SSHPORT=22" #/src/entrypoint.sh
      # - "BUSID=pci0:04:0:0:"
      # 
      - HOME=/_ext/home/headless
      - DISPLAY=${ENV_DISPLAY:-:1} #加ENV_,免优先取了环境变量而非.env内配置
      # - VNC_OFFSET=51
      - START_SESSION=${ENV_DESK:-openbox-session}
      - L=zh_CN
      - TZ=Asia/Shanghai
