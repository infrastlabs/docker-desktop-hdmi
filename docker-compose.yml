version: "2.4"
services:
  desktop:
    # image: hilschernetpi/netpi-desktop-hdmi
    # image: registry.cn-shenzhen.aliyuncs.com/infrasync/v2025:hilschernetpi--netpi-desktop-hdmi---1.3.0
    # image: registry.cn-shenzhen.aliyuncs.com/infrastlabs/docker-hdmi-desktop:latest
    # 
    # image: registry.cn-shenzhen.aliyuncs.com/infrastlabs/x11-base:app-ubuntu-20.04
    image: registry.cn-shenzhen.aliyuncs.com/infrastlabs/docker-hdmi-desktop:app-ubuntu-20.04
    entrypoint: bash /entry.sh
    # entrypoint: bash -c
    # command: "\"echo wait...; tail -f /dev/null;\"" 
    # hostname: deb1013
    restart: always
    privileged: true
    network_mode: host
    ports:
      - 20022:22
      - 25900:5900
    devices:
      - "/dev:/dev"
      # - "/dev/tty0:/dev/tty0"
      # - "/dev/tty2:/dev/tty2"
      # - "/dev/fb0:/dev/fb0"
      # - "/dev/input:/dev/input"
      # - "/dev/snd:/dev/snd"
    volumes: 
      - ./src/bin/:/usr/local/bin/
      - ./src/entrypoint.sh:/entrypoint.sh
      - ./src/entry.sh:/entry.sh
      - /_ext:/_ext
      # - /opt:/opt
    environment:
      - "SSHPORT=22"
      # - "BUSID=pci0:04:0:0:"
      - VNC_OFFSET=40
      - START_SESSION=${DESK:-openbox-session}
      - L=zh_CN
      - TZ=Asia/Shanghai
